{% extends "base.html" %}

{% block content %}
{% if mode == "new" %}
  <h2>Add Villager</h2>
{% else %}
  <h2>Edit Villager</h2>
{% endif %}

<form method="post" class="form-card">
  <div class="form-row">
    <label>Name</label>
    {% if mode == "new" %}
      <input type="text" name="villager_name" required>
    {% else %}
      <input type="text" name="villager_name" value="{{ villager[0] }}" readonly>
    {% endif %}
  </div>

  <div class="form-row">
    <label>Birthday Season</label>
    <select name="birthday_season">
      {% set current_season = villager[1] if villager else "" %}
      <option value="Spring" {{ "selected" if current_season == "Spring" else "" }}>Spring</option>
      <option value="Summer" {{ "selected" if current_season == "Summer" else "" }}>Summer</option>
      <option value="Fall"   {{ "selected" if current_season == "Fall"   else "" }}>Fall</option>
      <option value="Winter" {{ "selected" if current_season == "Winter" else "" }}>Winter</option>
    </select>
  </div>

  <div class="form-row">
    <label>Birthday Day</label>
    <input type="text" name="birthday_day" value="{{ villager[2] if villager else '' }}">
  </div>

  <div class="form-row">
    <label>Lives In</label>
    <input type="text" name="lives_in" value="{{ villager[3] if villager else '' }}">
  </div>

  <div class="form-row">
    <label>
      <input type="checkbox" name="can_marry"
             {% if villager and villager[4] %}checked{% endif %}>
      Romanceable
    </label>
  </div>

  <button type="submit" class="btn">Save</button>
  <a class="btn-secondary" href="{{ url_for('villagers') }}">Cancel</a>
</form>
{% endblock %}
