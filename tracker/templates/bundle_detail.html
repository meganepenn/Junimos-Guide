{% extends "base.html" %}

{% block content %}
{% if bundle %}
  <h2>{{ bundle[0] }}</h2>
  <p>Room: {{ bundle[1] }}</p>
{% else %}
  <h2>Bundle not found</h2>
{% endif %}

<h3>Required Items</h3>
<table class="sv-table">
  <thead>
    <tr>
      <th>Item</th>
      <th>Type</th>
      <th>Season</th>
    </tr>
  </thead>
  <tbody>
    {% for name, type_, season in items %}
    <tr>
      <td>{{ name }}</td>
      <td>{{ type_ }}</td>
      <td>{{ season }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<p><a href="{{ url_for('bundles') }}">Back to bundles</a></p>
{% endblock %}
