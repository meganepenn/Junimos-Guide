<!-- html for bundles -->
{% extends "base.html" %}

{% block title %}Bundles{% endblock %}

{% block content %}
<h2><span class="section-icon">📜</span>Bundles</h2>

<div class="cozy-card mb-4">
  <!-- filtering -->
    <div class="cozy-card-header">
        <span>🔎</span>
        <span>Narrow down bundles</span>
    </div>
    <form class="row g-3" method="get">
        <div class="col-md-5">
            <label class="form-label">Room</label>
            <select name="roomid" class="form-select">
                <option value="All" {% if selected_room == "All" or not selected_room %}selected{% endif %}>
                    All rooms
                </option>
                {% for r in rooms_list %}
                    <option value="{{ r[0] }}" {% if selected_room == r[0]|string %}selected{% endif %}>
                        {{ r[0] }} – {{ r[1] }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Seasonal bundles only?</label>
            <select name="seasonal" class="form-select">
                <option value="" {% if not seasonal_filter %}selected{% endif %}>Show all</option>
                <option value="Yes" {% if seasonal_filter == "Yes" %}selected{% endif %}>Seasonal only</option>
            </select>
        </div>
        <div class="col-md-3 d-flex align-items-end gap-2">
            <button class="btn btn-success" type="submit">Apply Filters</button>
            <a href="{{ url_for('bundles') }}" class="btn btn-secondary">Reset</a>
        </div>
    </form>
</div>

<!-- actual bundle table -->
<div class="cozy-card">
    <div class="cozy-card-header mb-2">
        <span>Bundle list</span>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-sm">
            <thead>
            <tr>
                <th>ID</th>
                <th>Bundle</th>
                <th>Room</th>
                <th>Seasonal?</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            {% for b in bundles %}
                <tr>
                    <td>{{ b[0] }}</td>
                    <td>{{ b[1] }}</td>
                    <td>{{ b[2] }}</td>
                    <td>
                        {% if b[3] %}
                            <span class="badge bg-success">Yes</span>
                        {% else %}
                            <span class="badge bg-secondary">No</span>
                        {% endif %}
                    </td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           href="{{ url_for('bundle_detail', bundle_id=b[0]) }}">
                            View items
                        </a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
