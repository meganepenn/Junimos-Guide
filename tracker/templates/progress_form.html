<!-- html for progress form -->
{% extends "base.html" %}

{% block title %}
    {% if mode == "edit" %}Edit Progress{% else %}New Progress{% endif %}
{% endblock %}

{% block content %}
<h2>
    {% if mode == "edit" %}Edit Progress{% else %}New Progress Entry{% endif %}
</h2>

<!-- progress form -->
<form method="post">
    <div class="mb-3">
        <label class="form-label">Bundle</label>
        <select name="bundleid" class="form-select" required>
            {% for b in bundles %}
                {# bundles is a list of tuples (bundleid, name) #}
                <option value="{{ b[0] }}"
                    {% if progress_row and b[0] == progress_row["bundleid"] %}selected{% endif %}>
                    {{ b[0] }} – {{ b[1] }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="completed" id="completed"
            {% if progress_row and progress_row["completed"] %}checked{% endif %}>
        <label class="form-check-label" for="completed">
            Bundle completed
        </label>
    </div>

    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3">{% if progress_row %}{{ progress_row["notes"] }}{% endif %}</textarea>
    </div>

    <button class="btn btn-success" type="submit">
        {% if mode == "edit" %}Save Changes{% else %}Create Progress{% endif %}
    </button>
    <a href="{{ url_for('progress') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
